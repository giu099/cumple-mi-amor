<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente dorado característico de Rapunzel -->
    <radialGradient id="coronagold" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="45%" stop-color="#F3C32C" />
      <stop offset="85%" stop-color="#CF8A06" />
      <stop offset="100%" stop-color="#9E5D00" />
    </radialGradient>

    <!-- Definición del módulo de 2 rayos (uno principal y uno secundario suave) -->
    <g id="sun-ray">
      <!-- Rayo principal curvado estilo sol de Corona -->
      <path fill="url(#coronagold)" d="
        M 250,162 
        C 256,120 232,82 278,38 
        C 260,82 292,112 278,154 
        C 268,162 258,164 250,162 Z" />
      <!-- Flama pequeña secundaria -->
      <path fill="url(#coronagold)" d="
        M 268,165 
        C 285,152 298,135 310,122 
        C 300,138 296,155 282,168 Z" />
    </g>
  </defs>

  <!-- Grupo central del Sol -->
  <g>
    <!-- Sol Central -->
    <circle cx="250" cy="250" r="82" fill="url(#coronagold)" stroke="#FFAE00" stroke-width="1.5" />

    <!-- 8 Rayos distribuidos simétricamente -->
    <use href="#sun-ray" />
    <use href="#sun-ray" transform="rotate(45 250 250)" />
    <use href="#sun-ray" transform="rotate(90 250 250)" />
    <use href="#sun-ray" transform="rotate(135 250 250)" />
    <use href="#sun-ray" transform="rotate(180 250 250)" />
    <use href="#sun-ray" transform="rotate(225 250 250)" />
    <use href="#sun-ray" transform="rotate(270 250 250)" />
    <use href="#sun-ray" transform="rotate(315 250 250)" />
  </g>
</svg>
